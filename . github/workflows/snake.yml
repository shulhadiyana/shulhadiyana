# .github/workflows/snake.yml
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Menjalankan otomatis setiap hari jam 00:00 UTC
  workflow_dispatch:      # Memungkinkan kamu menjalankan manual dari tab Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # Izin untuk menulis file ke repository

    steps:
      # Menjalankan action untuk membuat animasi ular
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shulha-Diyana   # Ganti dengan username-mu jika berbeda
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Men-deploy file SVG yang dihasilkan ke branch 'output'
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}